<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Connector</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0d0d1a;
      --surface: #151526;
      --surface-hover: #1c1c31;
      --border: #2d2d47;
      --text: #f4f4f7;
      --muted: #a3a3b5;
      --accent: #ff3b3b;
      --success: #35d07f;
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      min-height: 180px;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 13px;
    }

    main { padding: 18px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    h1, h2, p { margin: 0; }

    h1 {
      color: var(--accent);
      font-size: 16px;
      letter-spacing: 1px;
    }

    h2 { font-size: 14px; margin-bottom: 8px; }

    .status {
      color: var(--muted);
      font-size: 11px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
    }

    .muted { color: var(--muted); line-height: 1.6; }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 9px 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
    }

    button:hover { background: var(--surface-hover); }

    .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #160707;
      font-weight: bold;
    }

    .primary:hover { background: #ff5757; }

    .clean {
      border-color: rgba(53, 208, 127, .35);
      color: var(--success);
      text-align: center;
    }

    .pattern-list { display: grid; gap: 10px; }

    .pattern-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 5px;
      padding: 11px;
    }

    .pattern-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .pattern-name { font-weight: bold; }
    .confidence { color: var(--accent); white-space: nowrap; }

    .pattern-actions { display: flex; gap: 7px; }
    .pattern-actions button { padding: 7px 5px; }
    .confirm { border-color: rgba(53, 208, 127, .5); color: var(--success); }
    .false-alarm { color: var(--muted); }

    .message {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>DARK CONNECTOR</h1>
      <span class="status" id="status">SCANNING</span>
    </header>
    <section id="content" aria-live="polite"></section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
